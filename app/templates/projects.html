{% extends "base.html" %}

{% block title %}
Projects
{% endblock %}

{% block content %}

<h2>My Projects</h2>

<p>Here are some of my projects:</p>

<ul>

    {% for project in projects %}

        <li>
            <h3>
    <a href="{{ url_for('project_detail', name=project.name) }}">
        {{ project.title }}
    </a>
</h3>

<p>{{ project.description }}</p>

<p>Year: {{ project.year }}</p>
        </li>

    {% endfor %}

</ul>

{% endblock %}
